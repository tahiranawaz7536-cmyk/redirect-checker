<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirect Checker</title>
<style>
body{
font-family:Arial,sans-serif;
background:#f4f7fb;
margin:0;
padding:40px;
}
.container{
max-width:700px;
margin:auto;
background:#fff;
padding:25px;
border-radius:10px;
box-shadow:0 4px 15px rgba(0,0,0,.1);
}
h1{
text-align:center;
color:#2563eb;
}
input{
width:100%;
padding:12px;
font-size:16px;
margin:15px 0;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;
}
button{
width:100%;
padding:12px;
background:#2563eb;
color:#fff;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}
button:hover{
background:#1d4ed8;
}
.result{
margin-top:20px;
padding:15px;
background:#eef4ff;
border-radius:6px;
word-break:break-word;
}
</style>
</head>
<body>

<div class="container">
<h1>Redirect Checker</h1>

<p>Enter a URL to check if it redirects.</p>

<input type="url" id="url" placeholder="https://example.com">

<button onclick="checkRedirect()">Check Redirect</button>

<div class="result" id="result">
Result will appear here.
</div>
</div>

<script>
function checkRedirect(){
const url=document.getElementById("url").value.trim();

if(url===""){
document.getElementById("result").innerHTML="<b>Please enter a URL.</b>";
return;
}

document.getElementById("result").innerHTML=
"<b>URL:</b> "+url+
"<br><br>This demo interface is working successfully on GitHub Pages.<br><br><b>Note:</b> Browsers do not allow direct redirect-status checking from static HTML because of security (CORS). A real redirect checker requires a backend/server or API.";
}
</script>

</body>
</html>
